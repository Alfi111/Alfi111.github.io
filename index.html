<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="style.css">
    <title>Магазин</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <style>
        .comment-input {
            width: 100%;
            overflow: hidden; /* Скрыть полосу прокрутки */
            resize: none; /* Отключить возможность изменения размера */
        }
    </style>
</head>
<body>
    <!-- Главная страница -->
    <div id="page-index" class="page">
        <div class="container">
            <div class="inner">
                <div class="item" data-id="1">
                    <a href="#"><img src="1.png" alt="Product" class="img"></a>
                    <button class="buttonCountNumber"></button>
                    <div class="descript">
                        <span class="product-name">Бургер</span>
                        <span class="product-simbol"> • </span>
                        <span class="product-price">160 ₽</span>
                    </div>
                    <button class="btn open btn-select">Выбрать</button>
                    <div class="count_btn"> 
                        <button class="btn_count minus close"> - </button>
                        <button class="btn_count plus"> + </button>
                    </div>
                </div>
                <div class="item" data-id="2">
                    <a href="#"><img src="1.png" alt="Product" class="img"></a>
                    <button class="buttonCountNumber"></button>
                    <div class="descript">
                        <span class="product-name">Пицца</span>
                        <span class="product-simbol"> • </span>
                        <span class="product-price">350 руб</span>
                    </div>
                    <button class="btn open btn-select">Выбрать</button>
                    <div class="count_btn"> 
                        <button class="btn_count minus close"> - </button>
                        <button class="btn_count plus"> + </button>
                    </div>
                </div>
                <div class="item" data-id="3">
                    <a href="#"><img src="1.png" alt="Product" class="img"></a>
                    <button class="buttonCountNumber"></button>
                    <div class="descript">
                        <span class="product-name">Роллы</span>
                        <span class="product-simbol"> • </span>
                        <span class="product-price">250 руб</span>
                    </div>
                    <button class="btn open btn-select">Выбрать</button>
                    <div class="count_btn"> 
                        <button class="btn_count minus close"> - </button>
                        <button class="btn_count plus"> + </button>
                    </div>
                </div>
                <div class="item" data-id="4">
                    <a href="#"><img src="1.png" alt="Product" class="img"></a>
                    <button class="buttonCountNumber"></button>
                    <div class="descript">
                        <span class="product-name">Суши</span>
                        <span class="product-simbol"> • </span>
                        <span class="product-price">120 руб</span>
                    </div>
                    <button class="btn open btn-select">Выбрать</button>
                    <div class="count_btn"> 
                        <button class="btn_count minus close"> - </button>
                        <button class="btn_count plus"> + </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Страница корзины -->
    <div id="page-cart" class="page" style="display: none;">
        <div class="cart-container">
            <div class="cart-header">
                <h2 class="cart-title">Ваш заказ</h2>
                <button class="edit-button" onclick="showPage('index')">Изменить</button>
            </div>
            
            <div class="order-items" id="cart-items">
                <!-- Товары будут добавляться сюда -->
            </div>
            
            <div class="comment-section">
                <textarea 
                    class="comment-input" 
                    placeholder="Комментарий..."
                    rows="1"
                ></textarea>
            </div>
            <div class="comment-hint">
                Ваши пожелания, просьбы по доставке и т.д.
            </div>
        </div>
    </div>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="app.js"></script>
    <script>
        const textarea = document.querySelector('.comment-input');

        textarea.addEventListener('input', function () {
            this.style.height = 'auto'; // Сбросить высоту
            this.style.height = this.scrollHeight + 'px'; // Установить высоту в соответствии с содержимым
        });
    </script>
</body>
</html>
